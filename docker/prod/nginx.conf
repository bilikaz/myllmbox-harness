# Static SPA serve. The harness is a single-page app: every unknown path falls back to index.html so
# the hash/history router resolves client-side. Hashed assets are content-addressed, so cache forever.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind the Cloudflare tunnel the origin is always reached over http, so the visitor's real scheme
  # rides in X-Forwarded-Proto. Force https: an http visitor gets a permanent redirect (the app needs a
  # secure context — crypto.randomUUID, cross-origin calls to the user's box). No loop: https requests
  # arrive with X-Forwarded-Proto=https and fall through.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
